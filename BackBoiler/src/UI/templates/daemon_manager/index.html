<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daemon Service Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .service-card {
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }
        .service-card:hover {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .status-badge {
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
        }
        .action-btn {
            width: 35px;
            height: 35px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 2px;
        }
        .loading-spinner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-gear-fill"></i> Daemon Service Manager
            </span>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createServiceModal">
                <i class="bi bi-plus-circle"></i> Create New Service
            </button>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Search and Filter -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control" id="searchInput" placeholder="Search services...">
                </div>
            </div>
            <div class="col-md-6">
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="statusFilter" id="filterAll" value="all" checked>
                    <label class="btn btn-outline-primary" for="filterAll">All</label>
                    
                    <input type="radio" class="btn-check" name="statusFilter" id="filterRunning" value="running">
                    <label class="btn btn-outline-success" for="filterRunning">Running</label>
                    
                    <input type="radio" class="btn-check" name="statusFilter" id="filterStopped" value="stopped">
                    <label class="btn btn-outline-danger" for="filterStopped">Stopped</label>
                </div>
                <button class="btn btn-outline-secondary ms-2" onclick="refreshServices()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>
        </div>

        <!-- Services Grid -->
        <div class="row" id="servicesContainer">
            <!-- Service cards will be dynamically inserted here -->
        </div>
    </div>

    <!-- Create Service Modal -->
    <div class="modal fade" id="createServiceModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Daemon Service</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createServiceForm">
                        <div class="mb-3">
                            <label for="serviceName" class="form-label">Service Name</label>
                            <input type="text" class="form-control" id="serviceName" required 
                                   pattern="[a-zA-Z0-9-_]+" placeholder="my-service-name">
                            <div class="form-text">Only letters, numbers, hyphens, and underscores allowed</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="serviceCommand" class="form-label">Command</label>
                            <input type="text" class="form-control" id="serviceCommand" required
                                   placeholder="/usr/bin/python3 /path/to/script.py">
                        </div>
                        
                        <div class="mb-3">
                            <label for="serviceDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="serviceDescription" rows="2"></textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" id="runAtLoad" checked>
                                    <label class="form-check-label" for="runAtLoad">
                                        Run at system startup
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" id="keepAlive" checked>
                                    <label class="form-check-label" for="keepAlive">
                                        Keep alive (restart if crashes)
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="serviceUser" class="form-label">Run as User (Linux only)</label>
                            <input type="text" class="form-control" id="serviceUser" placeholder="root">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createService()">Create Service</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Service Details Modal -->
    <div class="modal fade" id="serviceDetailsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Service Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="serviceDetailsContent">
                    <!-- Details will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global variables
        let services = [];
        const csrfToken = '{{ csrf_token }}';

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            refreshServices();
            
            // Setup event listeners
            document.getElementById('searchInput').addEventListener('input', filterServices);
            document.querySelectorAll('input[name="statusFilter"]').forEach(radio => {
                radio.addEventListener('change', filterServices);
            });
        });

        // Fetch and display services
        async function refreshServices() {
            showLoading(true);
            try {
                const response = await fetch('/api/daemons/');
                const data = await response.json();
                services = data.services || [];
                displayServices(services);
            } catch (error) {
                showToast('Error fetching services', 'danger');
            } finally {
                showLoading(false);
            }
        }

        // Display services in the grid
        function displayServices(servicesToShow) {
            const container = document.getElementById('servicesContainer');
            container.innerHTML = '';

            if (servicesToShow.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-inbox display-1 text-muted"></i>
                        <p class="text-muted mt-3">No services found</p>
                    </div>
                `;
                return;
            }

            servicesToShow.forEach(service => {
                const card = createServiceCard(service);
                container.appendChild(card);
            });
        }

        // Create a service card element
        function createServiceCard(service) {
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4 mb-4';
            
            const statusClass = service.status === 'running' ? 'success' : 'danger';
            const statusIcon = service.status === 'running' ? 'play-circle-fill' : 'stop-circle-fill';
            
            col.innerHTML = `
                <div class="card service-card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="card-title mb-0">${service.name}</h5>
                            <span class="badge bg-${statusClass} status-badge">
                                <i class="bi bi-${statusIcon}"></i> ${service.status}
                            </span>
                        </div>
                        
                        <p class="card-text text-muted small">${service.description || 'No description'}</p>
                        
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div class="btn-group" role="group">
                                ${service.status === 'running' ? 
                                    `<button class="btn btn-sm btn-outline-danger action-btn" 
                                            onclick="performAction('${service.name}', 'stop')" 
                                            title="Stop">
                                        <i class="bi bi-stop-fill"></i>
                                    </button>` :
                                    `<button class="btn btn-sm btn-outline-success action-btn" 
                                            onclick="performAction('${service.name}', 'start')" 
                                            title="Start">
                                        <i class="bi bi-play-fill"></i>
                                    </button>`
                                }
                                
                                ${service.enabled ? 
                                    `<button class="btn btn-sm btn-outline-warning action-btn" 
                                            onclick="performAction('${service.name}', 'disable')" 
                                            title="Disable">
                                        <i class="bi bi-toggle-on"></i>
                                    </button>` :
                                    `<button class="btn btn-sm btn-outline-primary action-btn" 
                                            onclick="performAction('${service.name}', 'enable')" 
                                            title="Enable">
                                        <i class="bi bi-toggle-off"></i>
                                    </button>`
                                }
                                
                                <button class="btn btn-sm btn-outline-info action-btn" 
                                        onclick="showServiceDetails('${service.name}')" 
                                        title="Details">
                                    <i class="bi bi-info-circle"></i>
                                </button>
                                
                                <button class="btn btn-sm btn-outline-danger action-btn" 
                                        onclick="confirmDelete('${service.name}')" 
                                        title="Delete">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            return col;
        }

        // Perform action on service
        async function performAction(serviceName, action) {
            showLoading(true);
            try {
                const response = await fetch(`/api/daemons/${serviceName}/${action}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                if (data.success) {
                    showToast(`Successfully ${action}ed ${serviceName}`, 'success');
                    refreshServices();
                } else {
                    showToast(`Failed to ${action} ${serviceName}`, 'danger');
                }
            } catch (error) {
                showToast(`Error: ${error.message}`, 'danger');
            } finally {
                showLoading(false);
            }
        }

        // Create new service
        async function createService() {
            const form = document.getElementById('createServiceForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const config = {
                command: document.getElementById('serviceCommand').value,
                description: document.getElementById('serviceDescription').value,
                run_at_load: document.getElementById('runAtLoad').checked,
                keep_alive: document.getElementById('keepAlive').checked,
                user: document.getElementById('serviceUser').value || 'root'
            };

            showLoading(true);
            try {
                const response = await fetch('/api/daemons/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: document.getElementById('serviceName').value,
                        config: config
                    })
                });

                const data = await response.json();
                if (data.success) {
                    showToast('Service created successfully', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('createServiceModal')).hide();
                    form.reset();
                    refreshServices();
                } else {
                    showToast('Failed to create service', 'danger');
                }
            } catch (error) {
                showToast(`Error: ${error.message}`, 'danger');
            } finally {
                showLoading(false);
            }
        }

        // Delete service with confirmation
        function confirmDelete(serviceName) {
            if (confirm(`Are you sure you want to delete the service "${serviceName}"? This action cannot be undone.`)) {
                deleteService(serviceName);
            }
        }

        async function deleteService(serviceName) {
            showLoading(true);
            try {
                const response = await fetch(`/api/daemons/${serviceName}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': csrfToken
                    }
                });

                const data = await response.json();
                if (data.success) {
                    showToast(`Service ${serviceName} deleted successfully`, 'success');
                    refreshServices();
                } else {
                    showToast(`Failed to delete ${serviceName}`, 'danger');
                }
            } catch (error) {
                showToast(`Error: ${error.message}`, 'danger');
            } finally {
                showLoading(false);
            }
        }

        // Show service details
        function showServiceDetails(serviceName) {
            const service = services.find(s => s.name === serviceName);
            if (!service) return;

            const content = document.getElementById('serviceDetailsContent');
            content.innerHTML = `
                <table class="table table-sm">
                    <tbody>
                        <tr>
                            <th>Name:</th>
                            <td>${service.name}</td>
                        </tr>
                        <tr>
                            <th>Status:</th>
                            <td>
                                <span class="badge bg-${service.status === 'running' ? 'success' : 'danger'}">
                                    ${service.status}
                                </span>
                            </td>
                        </tr>
                        <tr>
                            <th>Enabled:</th>
                            <td>
                                <span class="badge bg-${service.enabled ? 'primary' : 'secondary'}">
                                    ${service.enabled ? 'Yes' : 'No'}
                                </span>
                            </td>
                        </tr>
                        <tr>
                            <th>PID:</th>
                            <td>${service.pid || 'N/A'}</td>
                        </tr>
                        <tr>
                            <th>Command:</th>
                            <td><code>${service.command || 'N/A'}</code></td>
                        </tr>
                        <tr>
                            <th>Description:</th>
                            <td>${service.description || 'No description'}</td>
                        </tr>
                        <tr>
                            <th>Last Started:</th>
                            <td>${service.last_started || 'N/A'}</td>
                        </tr>
                        <tr>
                            <th>Memory Usage:</th>
                            <td>${service.memory || 'N/A'}</td>
                        </tr>
                        <tr>
                            <th>CPU Usage:</th>
                            <td>${service.cpu || 'N/A'}</td>
                        </tr>
                    </tbody>
                </table>
                
                <div class="mt-3">
                    <h6>Recent Logs:</h6>
                    <pre class="bg-light p-2 rounded" style="max-height: 200px; overflow-y: auto;">
${service.logs || 'No logs available'}
                    </pre>
                </div>
            `;

            const modal = new bootstrap.Modal(document.getElementById('serviceDetailsModal'));
            modal.show();
        }

        // Filter services based on search and status
        function filterServices() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.querySelector('input[name="statusFilter"]:checked').value;

            let filtered = services;

            // Apply search filter
            if (searchTerm) {
                filtered = filtered.filter(service => 
                    service.name.toLowerCase().includes(searchTerm) ||
                    (service.description && service.description.toLowerCase().includes(searchTerm))
                );
            }

            // Apply status filter
            if (statusFilter !== 'all') {
                filtered = filtered.filter(service => service.status === statusFilter);
            }

            displayServices(filtered);
        }

        // Show loading spinner
        function showLoading(show) {
            document.querySelector('.loading-spinner').style.display = show ? 'block' : 'none';
        }

        // Show toast notification
        function showToast(message, type = 'info') {
            const toastHtml = `
                <div class="toast align-items-center text-white bg-${type} border-0" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">
                            ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            `;

            const toastContainer = document.querySelector('.toast-container');
            const toastElement = document.createElement('div');
            toastElement.innerHTML = toastHtml;
            toastContainer.appendChild(toastElement);

            const toast = new bootstrap.Toast(toastElement.querySelector('.toast'));
            toast.show();

            // Remove toast element after it's hidden
            toastElement.addEventListener('hidden.bs.toast', () => {
                toastElement.remove();
            });
        }
    </script>
</body>
</html>
