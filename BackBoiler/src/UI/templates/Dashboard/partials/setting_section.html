{% block setting_section_tab %}
{% load i18n %}

<div id="settings-content" class="tab-content hidden">
    <div class="p-6 space-y-4">
        <!-- Dark/Light Mode Toggle -->
        <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm">
            <label class="flex items-center justify-between cursor-pointer">
                <span class="text-gray-700 dark:text-gray-300 font-medium">{% trans "Dark Mode" %}</span>
                <div class="relative">
                    <input type="checkbox" id="theme-toggle-setting" class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
                </div>
            </label>
        </div>

        <!-- Direction Toggle (LTR/RTL) -->
        <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm">
            <label class="flex items-center justify-between cursor-pointer">
                <span class="text-gray-700 dark:text-gray-300 font-medium">{% trans "RTL Direction" %}</span>
                <div class="relative">
                    <input type="checkbox" id="direction-toggle-setting" class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
                </div>
            </label>
        </div>

        <!-- Profile Visibility Toggle -->
        <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm">
            <label class="flex items-center justify-between cursor-pointer">
                <span class="text-gray-700 dark:text-gray-300 font-medium">{% trans "Show Profile" %}</span>
                <div class="relative">
                    <input type="checkbox" id="profile-toggle-setting" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
                </div>
            </label>
        </div>

        <!-- Notifications Toggle -->
        <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm">
            <label class="flex items-center justify-between cursor-pointer">
                <span class="text-gray-700 dark:text-gray-300 font-medium">{% trans "Show Notifications" %}</span>
                <div class="relative">
                    <input type="checkbox" id="notification-toggle-setting" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
                </div>
            </label>
        </div>

        <!-- Language Selector Toggle -->
        <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm">
            <label class="flex items-center justify-between cursor-pointer">
                <span class="text-gray-700 dark:text-gray-300 font-medium" checked>{% trans "Show Language Selector" %}</span>
                <div class="relative">
                    <input type="checkbox" id="language-toggle-setting" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
                </div>
            </label>
        </div>
    </div>
</div>




{% endblock %}
